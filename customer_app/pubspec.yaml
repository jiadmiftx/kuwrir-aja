name: kuwrir_customer
description: KUWRIR Customer App — Order food from Kuta, Lombok
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  kuwrir_shared:
    path: ../shared/kuwrir_shared
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  flutter_bloc: ^9.1.1
  bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.5
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_local_notifications: ^22.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
