<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FinansialApp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif}
.login-card{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:1.5rem}
.logo i{font-size:2.5rem;color:#3b82f6}
.logo h4{color:#1e293b;font-weight:700;margin:.5rem 0 .2rem}
.logo small{color:#64748b;font-size:.8rem}
.form-label{font-size:.82rem;font-weight:500;color:#374151}
.form-control{font-size:.88rem;border-radius:8px;border-color:#d1d5db}
.form-control:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn-login{background:#3b82f6;border:none;border-radius:8px;padding:.7rem;font-weight:600;font-size:.9rem;width:100%;color:#fff;transition:background .2s}
.btn-login:hover{background:#2563eb;color:#fff}
.alert{border-radius:8px;font-size:.82rem}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <i class="fas fa-chart-line"></i>
    <h4>FinansialApp</h4>
    <small>Sistem Akuntansi Bisnis</small>
  </div>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
    <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label"><i class="fas fa-user me-1"></i>Username</label>
      <input type="text" name="username" class="form-control" required autofocus placeholder="Username">
    </div>
    <div class="mb-4">
      <label class="form-label"><i class="fas fa-lock me-1"></i>Password</label>
      <input type="password" name="password" class="form-control" required placeholder="Password">
    </div>
    <button type="submit" class="btn-login">
      <i class="fas fa-sign-in-alt me-2"></i>Masuk
    </button>
  </form>

  <div class="mt-3 px-2 py-2 rounded-3"
       style="background:#f8fafc;border:1px dashed #cbd5e1;font-size:.76rem;color:#64748b;text-align:center">
    <i class="fas fa-circle-info me-1" style="color:#94a3b8"></i>
    Login default &nbsp;·&nbsp;
    Username: <strong style="color:#334155">admin</strong> &nbsp;·&nbsp;
    Password: <strong style="color:#334155">admin123</strong>
  </div>
</div>
</body>
</html>
