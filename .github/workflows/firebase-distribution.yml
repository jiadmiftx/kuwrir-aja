name: Firebase App Distribution

on:
  # workflow_dispatch only, on purpose — the user tests client changes via
  # `flutter run` locally, so pushes to customer_app/driver_app/merchant_app/
  # shared no longer auto-trigger a Firebase App Distribution build. Run
  # manually (Actions tab, or `gh workflow run firebase-distribution.yml`)
  # when an internal-tester build is actually wanted.
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      customer: ${{ steps.filter.outputs.customer }}
      driver: ${{ steps.filter.outputs.driver }}
      merchant: ${{ steps.filter.outputs.merchant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'shared/**'
            customer:
              - *shared
              - 'customer_app/**'
            driver:
              - *shared
              - 'driver_app/**'
            merchant:
              - *shared
              - 'merchant_app/**'

  customer:
    needs: changes
    if: needs.changes.outputs.customer == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '%\n ' | base64 -d > customer_app/android/app/keystore.jks
      - run: flutter pub get
        working-directory: customer_app
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
        working-directory: customer_app
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_CUSTOMER }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: customer_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  driver:
    needs: changes
    if: needs.changes.outputs.driver == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '%\n ' | base64 -d > driver_app/android/app/keystore.jks
      - run: flutter pub get
        working-directory: driver_app
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
        working-directory: driver_app
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_DRIVER }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: driver_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  merchant:
    needs: changes
    if: needs.changes.outputs.merchant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '%\n ' | base64 -d > merchant_app/android/app/keystore.jks
      - run: flutter pub get
        working-directory: merchant_app
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
        working-directory: merchant_app
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_MERCHANT }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: merchant_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
