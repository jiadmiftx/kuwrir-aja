name: Deploy WhatsApp Gateway

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-gateway/**'
      - '.github/workflows/deploy-whatsapp-gateway.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        working-directory: whatsapp-gateway

      - run: node --check src/index.js
        working-directory: whatsapp-gateway

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-gateway
          push: true
          tags: |
            ghcr.io/jiadmiftx/kuwrir-aja/whatsapp-gateway:latest
            ghcr.io/jiadmiftx/kuwrir-aja/whatsapp-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # No deploy job: this in-repo whatsapp-gateway is dormant — production OTP
  # WhatsApp sending goes through a separate wa-gateway deployment
  # (WHATSAPP_GATEWAY_URL in deploy/docker-compose.yml), which has no
  # "whatsapp-gateway" service to deploy this image to. verify/build-and-push
  # still run so the code here stays buildable if it's ever revived.
