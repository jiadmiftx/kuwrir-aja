name: Deploy WhatsApp Gateway

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-gateway/**'
      - '.github/workflows/deploy-whatsapp-gateway.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        working-directory: whatsapp-gateway

      - run: node --check src/index.js
        working-directory: whatsapp-gateway

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-gateway
          push: true
          tags: |
            ghcr.io/jiadmiftx/kuwrir-aja/whatsapp-gateway:latest
            ghcr.io/jiadmiftx/kuwrir-aja/whatsapp-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kuwrir-aja
            git pull
            docker compose -f deploy/docker-compose.yml pull whatsapp-gateway
            docker compose -f deploy/docker-compose.yml up -d --no-deps whatsapp-gateway
            docker image prune -f
