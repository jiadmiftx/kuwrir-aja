# app.cocourir.com — Customer Web App / PWA (Next.js, served via Docker on port 8092)
# TLS terminated here (same wildcard cert as the other *.cocourir.com sites),
# Cloudflare proxies in Full/strict mode.

server {
    listen 80;
    listen [::]:80;
    server_name app.cocourir.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.cocourir.com;

    ssl_certificate     /etc/ssl/cocourir/cert.pem;
    ssl_certificate_key /etc/ssl/cocourir/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
