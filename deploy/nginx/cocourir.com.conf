# cocourir.com — Landing Page (static)
# Served via Nginx, SSL terminated by Cloudflare (Full mode)

server {
    listen 80;
    listen [::]:80;
    server_name cocourir.com www.cocourir.com;

    root /var/www/cocourir/landing;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
